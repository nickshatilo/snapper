name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$(echo "$VERSION" | awk -F. '{print $1 "." $2}')"
          else
            VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -n1)"
            TAG="$GITHUB_REF_NAME"
          fi

          if [ -z "$VERSION" ]; then
            echo "Failed to determine MARKETING_VERSION" >&2
            exit 1
          fi

          EXPECTED_TAG="v$(echo "$VERSION" | awk -F. '{print $1 "." $2}')"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $TAG does not match project version $VERSION (expected $EXPECTED_TAG)" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme Snapper \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"

      - name: Import signing certificate
        id: signing
        env:
          HAS_CERT: ${{ secrets.CERTIFICATE_P12 != '' }}
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          if [ "$HAS_CERT" != "true" ]; then
            echo "CERTIFICATE_P12 is required; refusing to create an unsigned release." >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)"/\1/p' | grep '^Developer ID Application:' | head -n1)"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in imported keychain" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "identity=$IDENTITY" >> $GITHUB_OUTPUT
          echo "keychain=$KEYCHAIN_PATH" >> $GITHUB_OUTPUT

      - name: Build release
        run: |
          SIGN_FLAGS=(
            CODE_SIGN_STYLE=Manual
            "CODE_SIGN_IDENTITY=${{ steps.signing.outputs.identity }}"
            "OTHER_CODE_SIGN_FLAGS=--keychain ${{ steps.signing.outputs.keychain }}"
          )

          xcodebuild build \
            -scheme Snapper \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            MARKETING_VERSION="${{ steps.version.outputs.VERSION }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            "${SIGN_FLAGS[@]}"

      - name: Sign for distribution
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/build/Build/Products/Release/Snapper.app"
          ENT="Snapper/Resources/Snapper.entitlements"

          # Re-sign a nested item, preserving its existing entitlements when it has any.
          sign_item() {
            local item="$1"
            local ent; ent="$(mktemp).plist"
            if codesign -d --entitlements "$ent" --xml "$item" >/dev/null 2>&1 \
                 && [ -s "$ent" ] && plutil -lint "$ent" >/dev/null 2>&1; then
              codesign -f -o runtime --timestamp -s "$IDENTITY" --keychain "$KEYCHAIN" --entitlements "$ent" "$item"
            else
              codesign -f -o runtime --timestamp -s "$IDENTITY" --keychain "$KEYCHAIN" "$item"
            fi
            rm -f "$ent"
          }

          # Sparkle ships its nested helpers pre-signed by the Sparkle team and
          # without a secure timestamp; re-sign them inside-out with our Developer
          # ID + Hardened Runtime + timestamp so notarization accepts them.
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE" ]; then
            V="$SPARKLE/Versions/B"
            for x in "$V/XPCServices/Downloader.xpc" "$V/XPCServices/Installer.xpc" \
                     "$V/Autoupdate" "$V/Updater.app"; do
              [ -e "$x" ] && sign_item "$x"
            done
            codesign -f -o runtime --timestamp -s "$IDENTITY" --keychain "$KEYCHAIN" "$SPARKLE"
          fi

          # Re-sign the app with explicit entitlements to strip the debug-only
          # get-task-allow entitlement Xcode injects, and add the secure timestamp.
          codesign -f -o runtime --timestamp -s "$IDENTITY" --keychain "$KEYCHAIN" \
            --entitlements "$ENT" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Signed for distribution."

      - name: Notarize
        env:
          HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ "$HAS_NOTARY" != "true" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "$NOTARY_TEAM_ID" ]; then
            echo "Apple notarization credentials are required; refusing to publish an unnotarized release." >&2
            exit 1
          fi

          APP_PATH="$RUNNER_TEMP/build/Build/Products/Release/Snapper.app"
          ZIP_PATH="$RUNNER_TEMP/notarize.zip"

          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        run: |
          APP_PATH="$RUNNER_TEMP/build/Build/Products/Release/Snapper.app"
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Create a staging folder with the app and Applications symlink
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "Snapper $VERSION" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "Snapper-${VERSION}.dmg"

      - name: Create zip
        run: |
          APP_PATH="$RUNNER_TEMP/build/Build/Products/Release/Snapper.app"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ditto -c -k --keepParent "$APP_PATH" "Snapper-${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Snapper ${{ steps.version.outputs.VERSION }}
          files: |
            Snapper-*.dmg
            Snapper-*.zip
          generate_release_notes: true
          draft: false
